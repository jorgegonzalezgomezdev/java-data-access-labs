services:
  db:
    image: mysql:8.4.13
    container_name: dam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: basededatos
      MYSQL_USER: bbdd
      MYSQL_PASSWORD: bbddadmin
    ports:
      - "3307:3306"
    volumes:
      - dam-mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro

volumes:
  dam-mysql-data:
